api: v1
name: autossh
kind: app
display: autossh
description: Automatically restart SSH sessions and tunnels, in case they drop.
homepage: https://www.harding.motd.ca/autossh/
license: MIT
version: 1.4g
channels:
    stable: 1.4g
provides:
    - autossh
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/jazzl0ver/autossh/releases/download/1.4g/autossh.exe
      sha256: b05e9599fa6e9ff9d2a57e141bdca0eb7f5829e8fd67e37e878863a4fd46469f
      bin:
        - autossh.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall autossh
test: autossh --version
