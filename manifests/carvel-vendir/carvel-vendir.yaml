      arch: amd64
      url: https://github.com/carvel-dev/vendir/releases/download/v0.46.3/vendir-windows-amd64.exe#/vendir.exe
      sha256: 68aa4fb1ff9ce66510dc9a77477d3ba0e304eb0770b478cd59eb8d1a0d8cfa5a
      bin:
        - vendir.exe
