api: v1
name: gitkube
kind: app
display: gitkube
description: Build and deploy docker images to Kubernetes using git push
homepage: https://github.com/hasura/gitkube
license: Apache-2.0
version: 0.3.0
channels:
    stable: 0.3.0
provides:
    - gitkube
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/hasura/gitkube/releases/download/v0.3.0/gitkube_windows_amd64.exe#/gitkube.exe
      sha256: c0c8420ef048d2023e756a5c11e66dcd98c36812a455b524dc33baec4f29b438
      bin:
        - gitkube.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall gitkube
test: gitkube --version
