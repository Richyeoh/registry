api: v1
name: git-ai
kind: app
display: git-ai
description: An open source git extension that tracks AI-generated code in your repositories, linking every AI-written line to the agent, model, and transcripts that generated it.
homepage: https://usegitai.com
license: Apache-2.0
version: 1.7.6
channels:
    stable: 1.7.6
provides:
    - git-ai
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/git-ai-project/git-ai/releases/download/v1.7.6/git-ai-windows-x64.exe#/git-ai.exe
      sha256: 57c5a8eea75bee6f09467fb17b63a657859ae1d82210d6382e4cc27752a90ddb
      bin:
        - git-ai.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall git-ai
test: git-ai --version
