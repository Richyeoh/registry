api: v1
name: cmctl
kind: app
display: cmctl
description: A command-line tool to manage cert-manager and its resources inside a Kubernetes cluster.
homepage: https://cert-manager.io/docs/reference/cmctl/
license: Apache-2.0
version: 2.6.2
channels:
    stable: 2.6.2
provides:
    - cmctl
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/cert-manager/cmctl/releases/download/v2.6.2/cmctl_windows_amd64.exe#/cmctl.exe
      sha256: 48f1ef1cffdac338ed0ba2e06c533d0e66868fe52b7f1c3f2e5428acaddbe4eb
      bin:
        - cmctl.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall cmctl
test: cmctl --version
