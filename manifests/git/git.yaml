api: v1
name: git
kind: app
display: git
description: A free and open source distributed version control system.
homepage: https://gitforwindows.org
license: Unknown
version: 2.56.1
channels:
    stable: 2.56.1
provides:
    - git
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/PortableGit-2.56.1-64-bit.7z.exe#/dl.7z
      sha256: 9dd04a608ceb5f6ab32a73709e0ecb159d211da71b697c45ff81f6dd0c6b49c7
      bin:
        - bin\sh.exe
        - cmd\git.exe
        - cmd\gitk.exe
        - cmd\git-gui.exe
        - cmd\scalar.exe
        - git-bash.exe
        - usr\bin\gpg.exe
        - usr\bin\gpg-agent.exe
        - usr\bin\gpgconf.exe
        - usr\bin\gpg-connect-agent.exe
        - usr\bin\pinentry.exe
      strip: 1
test: bin\sh --version
