api: v1
name: nvm
kind: app
display: nvm
description: A node.js version management utility for Windows.
homepage: https://github.com/nvm-windows/nvm
license: MIT
version: 2.0.1
channels:
    stable: 2.0.1
provides:
    - nvm
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/nvm-windows/nvm/releases/download/v2.0.1/nvm-2.0.1-x64-setup.exe
      sha256: 2ba6ab6290fdc7d1e608e76c97577ca6e1df772b2d59ab8ebc01e10788de8e57
      bin:
        - nvm.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall nvm
test: nvm --version
