api: v1
name: docker-pushrm
kind: app
display: docker-pushrm
description: Docker Push Readme - a Docker CLI plugin to update container repo docs.
homepage: https://github.com/christian-korneck/docker-pushrm
license: MIT
version: 1.9.0
channels:
    stable: 1.9.0
provides:
    - docker-pushrm
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/christian-korneck/docker-pushrm/releases/download/v1.9.0/docker-pushrm_windows_amd64.exe#/docker-pushrm.exe
      sha256: e1e084bc8968c0d4183c63d7c4090d4479e4c01e380454a52a798605d132e268
      bin:
        - docker-pushrm.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall docker-pushrm
test: docker-pushrm --version
