api: v1
name: jira
kind: app
display: jira
description: simple command line client for Atlassian's Jira service written in Go
homepage: https://github.com/go-jira/jira
license: Apache-2.0
version: 1.0.27
channels:
    stable: 1.0.27
provides:
    - jira
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/go-jira/jira/releases/download/v1.0.27/jira-windows-amd64.exe#/jira.exe
      sha256: d6f21182ccae4d5fb80bb7f6a598baafcd72b97dabe06f1b56630d30cd6d52b9
      bin:
        - jira.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall jira
test: jira --version
