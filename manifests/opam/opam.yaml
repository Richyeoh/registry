api: v1
name: opam
kind: app
display: opam
description: opam is a source-based package manager for OCaml.
homepage: https://opam.ocaml.org/
license: LGPL-2.1-only
version: 2.6.1
channels:
    stable: 2.6.1
provides:
    - opam
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/ocaml/opam/releases/download/2.6.1/opam-2.6.1-x86_64-windows.exe#/opam.exe
      sha256: 2548f0592abfa728432c85ef6d08bf97c295c1859ddca61876e33884336c130c
      bin:
        - opam.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall opam
test: opam --version
