api: v1
name: miktex
kind: app
display: miktex
description: MikTeX, an up-to-date implementation of TeX/LaTeX and related programs.
homepage: https://miktex.org
license: Unknown
version: "25.12"
channels:
    stable: "25.12"
provides:
    - miktex
platforms:
