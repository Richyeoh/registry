api: v1
name: openssl-light
kind: app
display: openssl-light
description: TLS/SSL toolkit (Light)
homepage: https://slproweb.com/products/Win32OpenSSL.html
license: Apache-2.0
version: 4.1.0
channels:
    stable: 4.1.0
provides:
    - openssl-light
platforms:
    - os: windows
      arch: amd64
      url: https://slproweb.com/download/Win64OpenSSL_Light-4_1_0.exe
      sha256: 7d1d4022eea9b89c5c6b691b01145f2e0f69aeaf6668635c8010a5f3f1c8c25d
      bin:
        - bin\openssl.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall openssl-light
test: bin\openssl --version
