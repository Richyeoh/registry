api: v1
name: gotify-cli
kind: app
display: gotify-cli
description: A command line interface for pushing messages to Gotify server
homepage: https://gotify.net/
license: MIT
version: 2.4.0
channels:
    stable: 2.4.0
provides:
    - gotify-cli
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/gotify/cli/releases/download/v2.4.0/gotify-cli-windows-amd64.exe#/gotify-cli.exe
      sha256: 42b6c44b04cc98146c7a897a153d70a83cc2cedbcc24dcf264219b32a8a6437c
      bin:
        - gotify-cli.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall gotify-cli
test: gotify-cli --version
