api: v1
name: gitlab-release-cli
kind: app
display: gitlab-release-cli
description: Interacts with GitLab's Releases API through the command line and through GitLab CI/CD's configuration file, .gitlab-ci.yml
homepage: https://gitlab.com/gitlab-org/release-cli
license: MIT
version: 0.24.0
channels:
    stable: 0.24.0
provides:
    - gitlab-release-cli
platforms:
    - os: windows
      arch: amd64
      url: https://gitlab.com/gitlab-org/release-cli/-/releases/v0.24.0/downloads/bin/release-cli-windows-amd64.exe#/release-cli.exe
      sha256: b1f76019b9fe36f1afb8d6413894d11c9d9dc25d88d47a7d3f1ecbe38955590d
      bin:
        - release-cli.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall gitlab-release-cli
test: release-cli --version
