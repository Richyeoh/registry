api: v1
name: raspberry-pi-imager
kind: app
display: raspberry-pi-imager
description: Tool for writing an Raspberry Pi OS images to SD cards.
homepage: https://www.raspberrypi.org/software
license: Apache-2.0
version: 2.0.12
channels:
    stable: 2.0.12
provides:
    - raspberry-pi-imager
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/raspberrypi/rpi-imager/releases/download/v2.0.12/imager-v2.0.12.exe
      sha256: 98bff90afe23339d0768915f6f68d35ac254740ec1eac2082ebeaa9ba41bc8e3
      bin:
        - rpi-imager.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall raspberry-pi-imager
test: rpi-imager --version
