api: v1
name: vagrant
kind: app
display: vagrant
description: A tool for building and managing virtual machine environments in a single workflow.
homepage: https://www.vagrantup.com/
license: MIT
version: 2.4.9
channels:
    stable: 2.4.9
provides:
    - vagrant
platforms:
    - os: windows
      arch: amd64
      url: https://releases.hashicorp.com/vagrant/2.4.9/vagrant_2.4.9_windows_amd64.msi
      sha256: 3bdd967927705872a70c7c98e0576afd5acd9dd73b527695f4d9dd75dd26cbe3
      bin:
        - bin\vagrant.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall vagrant
test: bin\vagrant --version
