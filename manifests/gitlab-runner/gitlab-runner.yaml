api: v1
name: gitlab-runner
kind: app
display: gitlab-runner
description: Run your jobs and send the results back to GitLab
homepage: https://docs.gitlab.com/runner/
license: MIT
version: 19.5.3
channels:
    stable: 19.5.3
provides:
    - gitlab-runner
platforms:
    - os: windows
      arch: amd64
      url: https://gitlab-runner-downloads.s3.amazonaws.com/v19.5.3/binaries/gitlab-runner-windows-amd64.exe#/gitlab-runner.exe
      sha256: a518a252d6354781d39b53ffc17ce18e4e1a400441a5dd2c21e87d9fe964db62
      bin:
        - gitlab-runner.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall gitlab-runner
test: gitlab-runner --version
