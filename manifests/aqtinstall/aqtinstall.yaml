api: v1
name: aqtinstall
kind: app
display: aqtinstall
description: A command line tool for downloading Qt binaries, documents and sources.
homepage: https://aqtinstall.readthedocs.io/en/latest/
license: MIT
version: 3.3.0
channels:
    stable: 3.3.0
provides:
    - aqtinstall
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/miurahr/aqtinstall/releases/download/v3.3.0/aqt_x64.exe#/aqt.exe
      sha256: 4f74d4c95c464d238d7e17ec2d9b7f22a7c333f0f5270a62584e2b47fc765150
      bin:
        - aqt.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall aqtinstall
test: aqt --version
