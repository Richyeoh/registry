api: v1
name: sshpass
kind: app
display: sshpass
description: Windows version of sshpass - noninteractive ssh password provider
homepage: https://github.com/xhcoding/sshpass-win32
license: MIT
version: 1.0.7
channels:
    stable: 1.0.7
provides:
    - sshpass
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/xhcoding/sshpass-win32/releases/download/v1.0.7/sshpass.exe
      sha256: d6daca3b946006bd22777661d50e96f593ee7f2c6eda7a4dc93c40f500ff0d0b
      bin:
        - sshpass.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall sshpass
test: sshpass --version
