api: v1
name: bluetooth-cli-tools
kind: app
display: bluetooth-cli-tools
description: A suite of command line utilities for Microsoft Windows that can be used to configure your bluetooth adapter, discover remote bluetooth devices and services, transfer files to OBEX capable devices.
homepage: https://bluetoothinstaller.com/bluetooth-command-line-tools
license: Freeware
version: 1.2.0.56
channels:
    stable: 1.2.0.56
provides:
    - bluetooth-cli-tools
platforms:
    - os: windows
      arch: amd64
      url: https://bluetoothinstaller.com/bluetooth-command-line-tools/BluetoothCLTools-1.2.0.56.exe
      sha256: a110c457e26a42debb5008038190a5f4a1c8ddeb828b8cd4676fb28eeddfc075
      bin:
        - bin\btdiscovery.exe
        - bin\btftp.exe
        - bin\btinfo.exe
        - bin\btobex.exe
        - bin\btpair.exe
        - bin\btcom.exe
        - bin\btconfig.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall bluetooth-cli-tools
test: bin\btdiscovery --version
