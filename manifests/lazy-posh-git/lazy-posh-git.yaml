license: MIT
version: 0.2.0
channels:
    stable: 0.2.0
provides:
    - lazy-posh-git
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/bergmeister/lazy-posh-git/releases/download/0.2.0/lazy-posh-git.zip
      sha256: 33b78789a46e694ff701d5f897a78a98c8c93447a208ffea92e7a9e7c58c2d10
      bin:
        - lazy-posh-git.exe
      strip: 1
test: lazy-posh-git --version
