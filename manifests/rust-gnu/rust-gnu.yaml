api: v1
name: rust-gnu
kind: app
display: rust-gnu
description: A language empowering everyone to build reliable and efficient software. (GNU toolchain)
homepage: https://www.rust-lang.org
license: MIT|Apache-2.0
version: 1.99.1
channels:
    stable: 1.99.1
provides:
    - rust-gnu
platforms:
    - os: windows
      arch: amd64
      url: https://static.rust-lang.org/dist/rust-1.99.1-x86_64-pc-windows-gnu.msi
      sha256: 8a5c93727d7ac758554193c7ece9916fa3c7aa1e9478a3a42e18c2e0a3ed2d2c
      bin:
        - bin\rustc.exe
        - bin\rustdoc.exe
        - bin\cargo.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall rust-gnu
test: bin\rustc --version
