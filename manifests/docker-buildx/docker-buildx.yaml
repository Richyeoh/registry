api: v1
name: docker-buildx
kind: app
display: docker-buildx
description: Docker CLI plugin for extended build capabilities with BuildKit
homepage: https://docs.docker.com/build/
license: Apache-2.0
version: 0.38.2
channels:
    stable: 0.38.2
provides:
    - docker-buildx
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/docker/buildx/releases/download/v0.38.2/buildx-v0.38.2.windows-amd64.exe#/docker-buildx.exe
      sha256: 9a6aca9c84adda0391d1d98d8b74b49359cad1bcdadd196a0a5d7d5dc4cf15e0
      bin:
        - docker-buildx.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall docker-buildx
test: docker-buildx --version
