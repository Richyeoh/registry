api: v1
name: rizin
kind: app
display: rizin
description: UNIX-like reverse engineering framework and command-line toolset.
homepage: https://rizin.re/
license: LGPL-3.0-only
version: 0.9.1
channels:
    stable: 0.9.1
provides:
    - rizin
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin_installer-v0.9.1-x86_64.exe
      sha256: 3bfea0e6e4cd3c557fa61e2118805047da73da8907a26007c64d7f32bc113f22
      bin:
        - bin\rizin.exe
        - bin\rz-asm.exe
        - bin\rz-ax.exe
        - bin\rz-bin.exe
        - bin\rz-diff.exe
        - bin\rz-find.exe
        - bin\rz-gg.exe
        - bin\rz-hash.exe
        - bin\rz-run.exe
        - bin\rz-sign.exe
        - bin\rz-test.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall rizin
test: bin\rizin --version
