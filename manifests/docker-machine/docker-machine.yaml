api: v1
name: docker-machine
kind: app
display: docker-machine
description: Docker Machine is a tool that lets you install Docker Engine on virtual hosts, and manage the hosts with commands
homepage: https://docs.docker.com/machine/
license: Apache-2.0
version: 0.16.2
channels:
    stable: 0.16.2
provides:
    - docker-machine
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/docker-archive-public/docker.machine/releases/download/v0.16.2/docker-machine-Windows-x86_64.exe#/docker-machine.exe
      sha256: dcf774857069749b5d973f85b15d926544a7c5556c3478c45b4f35cf86494130
      bin:
        - docker-machine.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall docker-machine
test: docker-machine --version
