api: v1
name: chainctl
kind: app
display: chainctl
description: Chainguard's command-line interface for managing container images, identity, and security configurations.
homepage: https://edu.chainguard.dev/chainguard/chainctl-usage/
license: Apache-2.0
version: 0.2.402
channels:
    stable: 0.2.402
provides:
    - chainctl
platforms:
    - os: windows
      arch: amd64
      url: https://dl.enforce.dev/chainctl/0.2.402/chainctl_windows_x86_64.exe#/chainctl.exe
      sha256: fce7c15b327a1b137c0ab4982b310ab7f84ed0e8aa288d3a242fdfcb52fdc576
      bin:
        - chainctl.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall chainctl
test: chainctl --version
