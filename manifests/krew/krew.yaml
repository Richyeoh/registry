api: v1
name: krew
kind: app
display: krew
description: Krew is the package manager for kubectl plugins.
homepage: https://krew.sigs.k8s.io/
license: Apache-2.0
version: 0.5.0
channels:
    stable: 0.5.0
provides:
    - krew
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/kubernetes-sigs/krew/releases/download/v0.5.0/krew.exe
      sha256: a5cb2f630e6a8e0b8ff238dc77e7288864bb3089783962ec8b08c80f38ca6a91
      bin:
        - krew.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall krew
test: krew --version
