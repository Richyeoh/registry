api: v1
name: helm-chart-releaser
kind: app
display: helm-chart-releaser
description: Tool designed to help GitHub repos self-host their own chart repos by adding Helm chart artifacts to GitHub Releases named for the chart version and then creating an index.yaml file for those releases that can be hosted on GitHub Pages (or elsewhere!).
homepage: https://github.com/helm/chart-releaser/
license: Apache-2.0
version: 1.10.1
channels:
    stable: 1.10.1
provides:
    - helm-chart-releaser
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/helm/chart-releaser/releases/download/v1.10.1/chart-releaser_1.10.1_windows_amd64.zip
      sha256: 5ee5269ad2fe9dcb60c3defa0fd3acfbec648999a53d0037f8f4d8f88c189feb
      bin:
        - cr.exe
      strip: 1
test: cr --version
