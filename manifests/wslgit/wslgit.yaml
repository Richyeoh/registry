api: v1
name: wslgit
kind: app
display: wslgit
description: A small executable that forwards all arguments to git running inside Bash on Windows/Windows Subsystem for Linux (WSL)
homepage: https://github.com/andy-5/wslgit
license: MIT
version: 1.3.1
channels:
    stable: 1.3.1
provides:
    - wslgit
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/andy-5/wslgit/releases/download/v1.3.1/wslgit.exe
      sha256: f41ca507009b42871c0d55eaab24b41d821d5eb36e109e56e0cbba5020eded58
      bin:
        - wslgit.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall wslgit
test: wslgit --version
