api: v1
name: docker-compose
kind: app
display: docker-compose
description: Define and run multi-container applications with Docker
homepage: https://docs.docker.com/compose/
license: Apache-2.0
version: 5.7.1
channels:
    stable: 5.7.1
provides:
    - docker-compose
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/docker/compose/releases/download/v5.7.1/docker-compose-windows-x86_64.exe#/docker-compose.exe
      sha256: e4316597452650ae92fe9719a2a7c2fce8f56c5ceafed88d2aed6e39b2b2b2d0
      bin:
        - docker-compose.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall docker-compose
test: docker-compose --version
