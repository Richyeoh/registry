api: v1
name: xata
kind: app
display: xata
description: The official command-line interface for Xata, an open source Postgres platform.
homepage: https://xata.io/docs/cli
license: Apache-2.0
version: 1.18.2
channels:
    stable: 1.18.2
provides:
    - xata
platforms:
    - os: windows
      arch: amd64
      url: https://xata-cli-versions.s3.amazonaws.com/versions/1.18.2-latest/xata-windows-x64.exe#/xata.exe
      sha256: e7d80d87d6aa270fdd451683e38800d5547ecbbc1a6dc3a1423d87dd0406fede
      bin:
        - xata.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall xata
test: xata --version
