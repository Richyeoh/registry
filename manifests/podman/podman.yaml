api: v1
name: podman
kind: app
display: podman
description: A tool for managing OCI containers and pods.
homepage: https://podman.io/
license: Apache-2.0
version: 6.2.0
channels:
    stable: 6.2.0
provides:
    - podman
platforms:
    - os: windows
      arch: amd64
      url: https://github.com/podman-container-tools/podman/releases/download/v6.2.0/podman-installer-windows-amd64.msi
      sha256: e4070491d0dba7138a06afd8e89e87a54b75b997801b5a81c911bc2869a743e9
      bin:
        - podman.exe
      strip: 1
installer:
    silent: /S
    uninstall: scoop uninstall podman
test: podman --version
