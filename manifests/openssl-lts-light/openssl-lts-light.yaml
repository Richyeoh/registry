api: v1
name: openssl-lts-light
kind: app
display: openssl-lts-light
description: TLS/SSL toolkit (3.0.X LTS Light)
homepage: https://slproweb.com/products/Win32OpenSSL.html
license: Apache-2.0
version: 3.0.22
channels:
    stable: 3.0.22
provides:
    - openssl-lts-light
platforms:
    - os: windows
      arch: amd64
